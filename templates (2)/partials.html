{{define "navbar"}}
<header class="main-header">
    <div class="header-container">
        <a href="/" class="logo">Forum</a>

        <div class="search-container">
            <input
                type="search"
                id="search-input"
                placeholder="Search discussions..."
                aria-label="Search discussions"
            >
        </div>

        <nav class="main-nav" id="main-nav">
            <a href="/" class="home-link" data-nav="home">Home</a>
            <a href="/activity/" class="activity-link" data-nav="activity">Activity</a>

            <!-- Notifications (registered users only, toggled by app.js) -->
            <div class="notif-dropdown-wrap hidden" id="notif-wrap">
                <button class="nav-icon-btn" id="notif-bell-btn" aria-label="Notifications">
                    🔔
                    <span class="notif-badge hidden" id="notif-badge">0</span>
                </button>
                <div class="dropdown-panel hidden" id="notif-panel">
                    <div class="dropdown-header">
                        <span>Notifications</span>
                        <button id="notif-mark-read">Mark all read</button>
                    </div>
                    <div id="notif-list"></div>
                </div>
            </div>

            <!-- Guest links -->
            <a href="/login/" class="login-link" id="nav-login-link">Login</a>
            <a href="/register/" class="register-link" id="nav-register-link">Register</a>

            <!-- Signed-in user menu -->
            <div class="user-menu-wrap hidden" id="user-menu-wrap">
                <button class="user-menu-trigger" id="user-menu-btn">
                    <span class="user-avatar" id="user-avatar">U</span>
                    <span id="user-menu-name">User</span>
                </button>
                <div class="dropdown-panel user-menu-panel hidden" id="user-menu-panel">
                    <a href="/activity/">My activity</a>
                    <button id="logout-btn" class="danger">Log out</button>
                </div>
            </div>
        </nav>
    </div>
</header>
{{end}}
