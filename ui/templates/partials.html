{{define "navbar"}}
<header class="main-header">
    <div class="header-container">
        <a href="/" class="logo">Forum</a>
        <form class="search-container" action="/" method="GET"><input type="search" name="q" value="{{.SearchQuery}}" placeholder="Search discussions..." aria-label="Search discussions"></form>
        <nav class="main-nav">
            <a href="/" class="home-link">Home</a>
            {{if .IsLoggedIn}}
                <a href="/activity/?tab=myposts" class="activity-link">Activity</a>
                <a href="/logout" class="login-link">Log out</a>
            {{else}}
                <a href="/login" class="login-link">Login</a>
                <a href="/register" class="register-link">Register</a>
            {{end}}
        </nav>
    </div>
</header>
{{end}}
