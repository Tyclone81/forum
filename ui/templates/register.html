<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Forum</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-brand">Forum</div>
        <h1>Create your account</h1>
        <p class="auth-subtitle">Join the conversation.</p>
        <form id="register-form" action="/register" method="POST">
            <div class="form-group"><label for="register-username">Username</label><input type="text" id="register-username" name="username" required></div>
            <div class="form-group"><label for="register-email">Email</label><input type="email" id="register-email" name="email" required></div>
            <div class="form-group"><label for="register-password">Password</label><input type="password" id="register-password" name="password" minlength="8" required></div>
            <p id="register-error" class="form-error"></p>
            <button type="submit" class="auth-button">Register</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="/login">Log in</a></p>
    </main>
    <script src="/js/auth.js"></script>
</body>
</html>
