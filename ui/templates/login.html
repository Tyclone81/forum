<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Forum</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-brand">Forum</div>
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Login to join the conversation</p>
        <form id="login-form" action="/login" method="POST">
            <div class="form-group"><label for="login-email">Email</label><input type="email" id="login-email" name="email" required></div>
            <div class="form-group"><label for="login-password">Password</label><input type="password" id="login-password" name="password" required></div>
            <p id="login-error" class="form-error"></p>
            <button type="submit" class="auth-button">Login</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="/register">Create an account</a></p>
        <p class="auth-footer"><a href="/">Continue as guest</a></p>
    </main>
    <script src="/js/auth.js"></script>
</body>
</html>
